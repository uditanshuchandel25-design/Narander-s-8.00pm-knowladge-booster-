name: Daily 8PM IST Banking & Insurance Brief

on:
  schedule:
    # 14:30 UTC = 20:00 (8:00 PM) IST every day
    - cron: "30 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - ".github/workflows/daily-8pm-intel.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "bm-intel-pages"
  cancel-in-progress: false

jobs:
  update-daily-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch verified last-24h BFSI intelligence
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: node scripts/fetch-intel.js

      - name: Commit & publish updated 8PM IST edition
        if: github.event_name != 'push'
        run: |
          git config user.name "BM Daily Intel Bot"
          git config user.email "bot@bm-daily-intel.local"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish daily 8:00 PM IST banking intelligence edition"
            git push
          fi

      - name: Upload PWA folder for GitHub Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: update-daily-intel
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy BM INTEL PWA to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
